<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{ TEMPLATE_TITLE }} | Unified Learning Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="./app/theme.css"/>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        // Mermaid: ダークテーマで初期化。DOMContentLoaded を待たずに即実行（CDN読込直後に必要）
        mermaid.initialize({
            startOnLoad: true,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                primaryColor: '#38bdf8',
                primaryTextColor: '#f1f5f9',
                primaryBorderColor: '#334155',
                lineColor: '#64748b',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            },
            flowchart: { useMaxWidth: true, htmlLabels: true },
            securityLevel: 'loose'
        });
    </script>
    <style>
        /* Unified Theme Overrides */
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --primary-neon: #38bdf8;
            --accent-neon: #f472b6;
        }

        body { transition: background 0.5s ease; margin: 0; }
        body[data-mode="TEST"] { background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); }

        .app-shell { display: flex; height: 100vh; overflow: hidden; }
        
        /* Modern Glass Sidebar */
        .side-nav {
            width: 320px; background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; padding: 40px 20px;
            flex-shrink: 0; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
            position: relative;
        }
        .side-nav.collapsed { width: 60px; padding: 40px 10px; }
        .side-nav.collapsed .nav-header, 
        .side-nav.collapsed #outline { opacity: 0; pointer-events: none; transition: 0.2s; }
        
        .nav-toggle {
            position: absolute; top: 15px; right: -15px; width: 30px; height: 30px;
            background: var(--primary-neon); border-radius: 50%; color: #000;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; box-shadow: 0 0 10px rgba(56,189,248,0.5);
            z-index: 100; transition: 0.3s;
        }
        .side-nav.collapsed .nav-toggle { right: 15px; transform: rotate(180deg); }

        .nav-header { font-size: 1.2rem; font-weight: 800; color: var(--primary-neon); margin-bottom: 40px; white-space: nowrap; transition: 0.3s; }

        /* Content Area */
        .content-viewport { flex-grow: 1; overflow-y: auto; padding: 60px; scroll-behavior: smooth; min-width: 0; transition: padding 0.3s ease; }
        .reader-view { max-width: 900px; margin: 0 auto; line-height: 1.8; }
        
        /* Mode Switcher Floating */
        .mode-fab {
            position: fixed; top: 40px; right: 40px; z-index: 1000;
            background: var(--glass-bg); border: 1px solid var(--primary-neon);
            padding: 10px 20px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            font-weight: 700; color: #fff;
        }

        /* Inline Quiz Injection */
        .inline-quiz {
            background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 12px; padding: 25px; margin: 40px 0;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .term-highlight {
            color: var(--primary-neon); border-bottom: 1px dashed var(--primary-neon);
            cursor: pointer; transition: 0.3s;
        }
        .term-highlight:hover { background: rgba(56, 189, 248, 0.1); }

        /* === Basetract Responsive Mobile Layout (Architecture Standard) === */
        @media (max-width: 860px) {
            /* 1. Stack vertical */
            .app-shell, body { flex-direction: column !important; overflow: auto !important; }
            
            /* 2. Sidebar goes to top, 100% width */
            .side-nav { position: relative !important; width: 100% !important; height: auto !important; padding: 20px !important; border-right: none !important; border-bottom: 2px solid var(--primary-neon) !important; z-index: 10 !important; transform: none !important; left: 0 !important; margin-left: 0 !important; }
            .side-nav.collapsed { height: 60px !important; overflow: hidden !important; }
            .nav-toggle { top: 15px !important; right: 15px !important; }
            .nav-header { margin-bottom: 20px !important; opacity: 1 !important; pointer-events: auto !important; }
            #outline { display: flex !important; flex-wrap: wrap !important; gap: 10px !important; }
            .side-nav.collapsed #outline { display: none !important; }
            
            /* 3. Main content reclaims 100% space */
            .content-viewport, #view-read, #view-test { margin-left: 0 !important; padding: 20px 10px !important; width: 100% !important; max-width: 100% !important; min-width: 0 !important; overflow-y: visible !important; }
            .reader-view { max-width: 100% !important; margin-left: 0 !important; }
            
            /* 4. Controls reposition */
            .mode-fab { top: auto !important; bottom: 30px !important; right: 40px !important; transform: scale(0.8); }
            
            /* 5. Safe overflow */
            pre, code, table, .table-wrapper { max-width: 100% !important; overflow-x: auto !important; word-wrap: normal !important; white-space: pre-wrap !important; -webkit-overflow-scrolling: touch !important; }
            p, li, div, h1, h2, h3, h4, h5 { overflow-wrap: break-word !important; word-break: break-word !important; }
        }
    </style>
</head>
<body data-mode="READ">
    <div class="mesh-bg"></div>

    <button class="mode-fab" onclick="window.basetract.switchMode(window.basetract.mode === 'READ' ? 'TEST' : 'READ')">
        SWITCH TO <span id="mode-label">TEST</span>
    </button>

    <div class="app-shell">
        <aside class="side-nav" id="sidebar">
            <button class="nav-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="nav-header">BASETRACT // {{ TEMPLATE_DOMAIN }}</div>
            <div id="outline" style="font-size: 0.9rem; color: #94a3b8;">
                {{ TEMPLATE_OUTLINE }}
            </div>
        </aside>

        <main class="content-viewport">
            <div id="view-read" class="reader-view">
                <h1>{{ TEMPLATE_TITLE }}</h1>
                <p style="color: #94a3b8; margin-bottom: 60px;">Basetract Unified Learning Ecosystem</p>
                
                <div id="template-content-injection">
                    <!-- INFRASTRUCTURE: Pure dynamic payload injection. Zero hardcoded contextual data. -->
                    {{ TEMPLATE_CONTENT }}
                </div>
            </div>

            <div id="view-test" class="reader-view" style="display:none;">
                <h1>Exam Laboratory</h1>
                <div id="exam-mount">
                    <!-- Exam components injected here dynamically based on dataBuffer -->
                </div>
            </div>
        </main>
    </div>

    <!-- Infrastructure Loader Logic -->
    <script src="./app/loader.js"></script>
    <script src="./app/basetract_core.js"></script>
    <script>
        // Override switchMode to handle UI updates
        const originalSwitch = window.basetract.switchMode.bind(window.basetract);
        window.basetract.switchMode = function(m) {
            originalSwitch(m);
            document.getElementById('mode-label').textContent = m === 'READ' ? 'TEST' : 'READ';
            document.getElementById('view-read').style.display = m === 'READ' ? 'block' : 'none';
            document.getElementById('view-test').style.display = m === 'TEST' ? 'block' : 'none';
        };

        // ← 修正: 初期データをロードする。
        //   loader.js と basetract_core.js が両方ロードされた後に実行される。
        //   ingestAll() は initial_state.js（sample_data.js のデプロイ先）を読み込み、
        //   window.basetract.injectData() を呼び出して registry を更新する。
        //   これがないと Mini-Quiz / TEST モードが常に空になる。
        window.basetractLoader.ingestAll(['initial_state']).catch(e => {
            console.error('[Basetract] Initial data load failed:', e);
        });
    </script>
</body>
</html>
